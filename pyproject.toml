[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oramasys"
version = "2.0.0-alpha.1"
description = "Hardware-aware multi-agent orchestration system (oramasys graph + API)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "perpetua-core>=2.0.0-alpha.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["orama"]
