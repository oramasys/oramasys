[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oramasys"
version = "2.0.0-alpha.1"
description = "Hardware-aware multi-agent orchestration system (oramasys graph + API)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "oramasys-telos @ git+https://github.com/oramasys/telos.git@19810d0493344aa507c29c462f68afbc1b98ecf8",
    "perpetua-core @ git+https://github.com/oramasys/perpetua-core.git@86225fa5c974ab2fe0b65d228a2b31888aaa440c",
    "fastapi>=0.110",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6.0",
    "httpx",
    "respx>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/orama"]

[tool.hatch.metadata]
# Required for the immutable git+https direct references above: hatchling
# refuses direct-reference dependencies in [project.dependencies] otherwise.
allow-direct-references = true
