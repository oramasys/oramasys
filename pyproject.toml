[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oramasys"
version = "2.0.0-alpha.1"
description = "Hardware-aware multi-agent orchestration system (oramasys graph + API)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "oramasys-telos @ git+https://github.com/oramasys/telos.git@931b6347142e8e66b31136e3ac8159d86eb5b2f7",
    "perpetua-core @ git+https://github.com/oramasys/perpetua-core.git@6d75cfe08af95992dddffab13ae3019aa9c41350",
    "oramasys-agate @ git+https://github.com/oramasys/agate.git@172bfc3ebf00d507856e70d0f6a0e7dbd577ffbc",
    "fastapi>=0.110",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.29",
    # Optional AuthProviders (feature-flagged): OIDC/OAuth clients + JWT verify.
    "Authlib>=1.3",
    "joserfc>=1.0",
    # NIP-98 Schnorr verify for BuzzNostrProvider (inline crypto preference).
    "coincurve>=20.0",
    # BitChat-compatible Noise XX (X25519 + ChaCha20-Poly1305).
    "cryptography>=42",
]

[project.optional-dependencies]
# Opt-in delivery of the Phylax verifier that grant-backed serving composes (DEC-Q-05).
# Never a base dependency: a default install stays Phylax-free and grants stay disabled.
# The commit must equal requirements/compatibility-phylax-verify-only.txt (a test enforces it).
grant-serving = [
    "oramasys-phylax @ git+https://github.com/oramasys/phylax.git@0c3e860749b3ff8f62e102679f1f415f8acf0a61",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=6.0",
    "httpx",
    "respx>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/orama"]

[tool.hatch.metadata]
# Required for the immutable git+https direct references above: hatchling
# refuses direct-reference dependencies in [project.dependencies] otherwise.
allow-direct-references = true
