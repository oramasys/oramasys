# Example deployment profile. Copy to config/serving-profile.yml (gitignored)
# and edit; the same file goes on every node, each node picks its own entry.
# ORAMA_NODE_ID names this host (falls back to the hostname). ORAMA_NODE_ROLE
# can only LOWER a role. The profile alone never enables serving.
#
# ACTIVE: Mac primary, Windows clients (the operator's installation).
version: 1
installation: example
nodes:
  - id: mac-studio
    os: macos
    role: primary-server
    serves: [verify]
    endpoint: mac-studio.local:8443
    identity:
      server_account: _orama-serve
      signer_account: _orama-signer
      expected_principal: null   # fill in the uid after the account exists
    state_root: /Library/Application Support/Oramasys
    public_state: local
  - id: win-node
    os: windows
    role: client
  - id: win-5080
    os: windows
    role: client

