name: grant composition interop

# Ubuntu evidence that a grant issued by the pinned Phylax is verified through the read-only
# verifier and spent by the Oramasys composition, file-backed, through the real default opener.
# This is CI qualification evidence only: it enables nothing, promotes no production pin, and is
# not a required check until an operator registers it. The Phylax commit lives in exactly one
# place, requirements/compatibility-phylax-verify-only.txt, and the `grant-serving` extra in
# pyproject.toml must equal it. The default Oramasys install stays Phylax-free; this job installs
# through the extra, the delivery surface a deployment would use, and proves the result is that
# commit.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  grant-composition-interop:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    env:
      PHYLAX_REPOSITORY_URL: https://github.com/oramasys/phylax.git
      ORAMA_REQUIRE_PHYLAX_INTEROP: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Oramasys through its opt-in grant-serving extra
        run: |
          python -m pip install --no-cache-dir '.[dev,grant-serving]'
          python -m pip check
      - name: Prove the installed Phylax is the pinned source
        id: pin
        working-directory: ${{ runner.temp }}
        run: |
          RESULT="$(python -I "$GITHUB_WORKSPACE/scripts/verify_phylax_pin.py" \
            "$GITHUB_WORKSPACE/requirements/compatibility-phylax-verify-only.txt" \
            "${PHYLAX_REPOSITORY_URL}")"
          echo "$RESULT"
          echo "url=$(echo "$RESULT" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo "$RESULT" | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Issuer-to-ledger probe
        run: python scripts/verify_grant_interop.py
      - name: File-backed issue, read-only verify and consume
        run: |
          python -W error::ResourceWarning -m pytest -q src/tests/interop \
            --junitxml=interop-results.xml
      - name: Build the sanitized receipt
        if: always()
        run: |
          python scripts/phylax_interop_receipt.py interop-results.xml \
            requirements/compatibility-phylax-verify-only.txt \
            "${{ steps.pin.outputs.url }}" "${{ steps.pin.outputs.commit }}" > interop-receipt.json
      - name: Retain the sanitized receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phylax-interop-receipt-${{ matrix.python-version }}
          path: interop-receipt.json
          if-no-files-found: warn
