name: Native Windows private-store security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-private-store:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install focused test runner
        run: python -m pip install 'pytest>=7,<9'
      - name: Exercise real Win32 ownership, protected ACLs and unsafe-ACL refusal
        env:
          PYTHONPATH: src
        run: python -m pytest -q src/tests/test_windows_private_native.py
      - name: Exercise bounded replacement and lock-cleanup semantics
        env:
          PYTHONPATH: src
        run: python -m pytest -q src/tests/test_private_store.py -k 'safe_replace or nonce_lock_failure'
