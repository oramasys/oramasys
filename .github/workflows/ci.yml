name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    env:
      ORAMA_DOCS_V2_REGISTRY: docs-candidate/docs/v2/references/loop-graph-compatibility-2026-10-09/ownership-registry.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable canonical registry profiles
        uses: actions/checkout@v4
        with:
          repository: diazMelgarejo/orama-system
          ref: 7b7f9d84e43f0709115588a95b13a78badb8369f
          path: docs-candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Enforce Telos network authority
        run: python scripts/check_telos_network_authority.py src/orama
      - name: Test with coverage
        run: python -m pytest src/tests --cov=orama --cov-report=term-missing --cov-fail-under=80
      - name: Compile smoke
        run: python -m compileall -q src/orama
