name: R3 public authority composition candidate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  r3-composition:
    name: r3-composition (${{ matrix.python-version }}, ${{ matrix.producer.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        producer:
          - name: merged
            ref: a7211df7d58695f35f5afee9b6b50af6a3f96139
          - name: commit-time-repair
            ref: b2edfe9584f4e013105cab3d87fda174e13079f6
    env:
      ORAMA_R3_INTEROP_REQUIRED: "1"
      ORAMA_EFFECT_INTEROP_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      # Source-level test candidate only. No production pin or accepted generation changes.
      - name: Check out immutable public producer candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: oramasys/phylax
          ref: ${{ matrix.producer.ref }}
          path: phylax-r3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install consumer test environment without enabling grant serving
        run: |
          python -m pip install '.[dev]' 'PyNaCl==1.6.2'
          python -m pip check
      - name: Verify public authority and existing lifecycle refusals
        env:
          PYTHONPATH: phylax-r3/src:src
        run: >-
          python -m pytest -q
          src/tests/r3_interop
          src/tests/effect_interop
          src/tests/test_retained_dispatch_authority.py
          src/tests/test_approval_transaction_recheck.py
          src/tests/test_dispatch_attempts.py
          src/tests/test_serve_with_effect_grants.py
          src/tests/test_inert_effect_process_crashes.py
