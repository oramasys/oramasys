name: permit interop

# Cross-repository evidence that the Oramasys consumer and the pinned Phylax issuer still interoperate
# with real Ed25519ph signatures: the shared probe issues permits from Phylax, authorizes them through
# the consumer rules here, and proves the clean-rollback fork is detected. The Phylax commit lives in
# exactly one place, requirements/compatibility-phylax-permit.txt; bumping it is part of pin
# promotion. This is CI qualification evidence only: it enables nothing and promotes no production
# pin. The Oramasys product code stays crypto-free; only the test-side probe imports PyNaCl.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  permit-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Read the pinned Phylax commit
        id: pin
        run: |
          PIN="$(tr -d '[:space:]' < requirements/compatibility-phylax-permit.txt)"
          echo "$PIN" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit=$PIN" >> "$GITHUB_OUTPUT"
          PROBE_PIN="$(tr -d '[:space:]' < requirements/compatibility-phylax-slice2-probe.txt)"
          echo "$PROBE_PIN" | grep -Eq '^[0-9a-f]{40}$'
          echo "probe_commit=$PROBE_PIN" >> "$GITHUB_OUTPUT"
      - name: Check out Phylax at the pinned commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: oramasys/phylax
          ref: ${{ steps.pin.outputs.commit }}
          path: phylax-pinned
          persist-credentials: false
      # Probe source only: do not use this checkout to execute issuer code.
      - name: Check out the pinned slice 2 probe source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: oramasys/phylax
          ref: ${{ steps.pin.outputs.probe_commit }}
          path: phylax-probe-pinned
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyNaCl only
        run: python -m pip install 'PyNaCl>=1.5'
      - name: Probe copies must be byte-identical
        run: bash scripts/check-permit-probe-parity.sh phylax-pinned phylax-probe-pinned
      - name: Run the interop probe
        run: python src/tests/interop/c2_interop_probe.py "$GITHUB_WORKSPACE/phylax-pinned" "$GITHUB_WORKSPACE"
      - name: Run the slice 2 interop probe
        run: python src/tests/interop/c2_slice2_probe.py "$GITHUB_WORKSPACE/phylax-pinned" "$GITHUB_WORKSPACE"
      - name: Read the pinned Phylax Part 3 events commit
        id: events-pin
        run: |
          PIN="$(tr -d '[:space:]' < requirements/compatibility-phylax-events.txt)"
          echo "$PIN" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit=$PIN" >> "$GITHUB_OUTPUT"
      - name: Check out Phylax at the pinned Part 3 events commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: oramasys/phylax
          ref: ${{ steps.events-pin.outputs.commit }}
          path: phylax-events-pinned
          persist-credentials: false
      - name: Part 3 events probe copies must be byte-identical
        run: cmp src/tests/interop/c2_part3_events_probe.py phylax-events-pinned/src/tests/interop/c2_part3_events_probe.py
      - name: Run the Part 3 events interop probe
        run: python src/tests/interop/c2_part3_events_probe.py "$GITHUB_WORKSPACE/phylax-events-pinned" "$GITHUB_WORKSPACE"
