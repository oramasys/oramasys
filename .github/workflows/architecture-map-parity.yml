name: Architecture map parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-graph-meanings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check out reviewed v1 taxonomy and canonical checker
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: diazMelgarejo/orama-system
          ref: a485860014520db9d690cd76215ea89607596d8c
          path: legacy-map
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Exercise canonical checker regressions
        run: python -m unittest discover -s legacy-map/tests -p test_architecture_map_parity.py -v
      - name: Compare shared graph meanings only
        run: python legacy-map/scripts/review/check_architecture_map_parity.py legacy-map/ARCHITECTURE.md ARCHITECTURE.md
