name: manifest schema 3

# Validates the schema-3 compatibility manifest on Ubuntu with the producer reference taken from
# the registry revision this workflow itself checks out, never from the manifest, so the registry
# binding is real. The digest is printed and retained but stays UNBOUND: freezing it is an
# operator action. Not a required check until an operator registers it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check out immutable canonical registry profiles
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: diazMelgarejo/orama-system
          ref: 65ec365293c6a892cd4f978e656cfb61c0d04b9a
          path: docs-candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Oramasys
        run: python -m pip install --no-cache-dir '.[dev]'
      - name: Validate the manifest against the checked-out registry revision
        run: |
          REF="$(git -C docs-candidate rev-parse HEAD)"
          python scripts/compat_manifest_digest.py requirements/compatibility-manifest.v3.json \
            --producer-ref "$REF" --allow-unbound | tee manifest-digest.txt
      - name: Retain the digest receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-schema3-digest-${{ matrix.python-version }}
          path: manifest-digest.txt
          if-no-files-found: warn
