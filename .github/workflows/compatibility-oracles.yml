name: compatibility oracles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-oracles:
    runs-on: ubuntu-latest
    env:
      ORAMA_DOCS_V2_REGISTRY: docs-candidate/docs/v2/references/loop-graph-compatibility-2026-10-09/ownership-registry.json
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable canonical registry profiles
        uses: actions/checkout@v4
        with:
          repository: diazMelgarejo/orama-system
          ref: 7b7f9d84e43f0709115588a95b13a78badb8369f
          path: docs-candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read immutable Core test candidate
        id: core
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          sha = Path("requirements/compatibility-core-candidate.txt").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Core test candidate must be an immutable commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"sha={sha}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: oramasys/perpetua-core
          ref: ${{ steps.core.outputs.sha }}
          path: core-candidate
          persist-credentials: false
      - name: Install isolated pinned oracle environment
        run: |
          python -m pip install -r requirements/compatibility-oracles-py312.txt
          python -m pip install --no-deps --no-build-isolation -e ./core-candidate -e .
          python -m pip check
      - name: Full application suite and real offline oracle cells
        env:
          # The candidate Core must provide R3; its tests cannot be skipped here.
          ORAMA_REQUIRE_CORE_R3: "1"
        run: python -m pytest -q src/tests tests/oracles
