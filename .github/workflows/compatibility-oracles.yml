name: compatibility oracles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-oracles:
    runs-on: ubuntu-latest
    env:
      ORAMA_DOCS_V2_REGISTRY: docs-candidate/docs/v2/references/loop-graph-compatibility-2026-10-09/ownership-registry.json
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            profile: policy-r3
            core-file: requirements/compatibility-core-policy-r3.txt
            require-r3: "0"
          - python-version: "3.12"
            profile: policy-r3
            core-file: requirements/compatibility-core-policy-r3.txt
            require-r3: "0"
          - python-version: "3.11"
            profile: core-r3
            core-file: requirements/compatibility-core-candidate.txt
            require-r3: "1"
          - python-version: "3.12"
            profile: core-r3
            core-file: requirements/compatibility-core-candidate.txt
            require-r3: "1"
          - python-version: "3.11"
            profile: production
            core-file: requirements/compatibility-core-production.txt
            require-r3: "1"
          - python-version: "3.12"
            profile: production
            core-file: requirements/compatibility-core-production.txt
            require-r3: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check out immutable canonical registry profiles
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: diazMelgarejo/orama-system
          ref: 28672bf366e5a4a6917f2cb9236eaf696e70c97b
          path: docs-candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read immutable Core lane revision
        id: core
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          sha = Path("${{ matrix.core-file }}").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Core lane revision must be an immutable commit")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"sha={sha}\n")
          PY
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: oramasys/perpetua-core
          ref: ${{ steps.core.outputs.sha }}
          path: core-candidate
          persist-credentials: false
      - name: Install isolated pinned oracle environment
        run: |
          python -m pip install -r requirements/compatibility-oracles-py312.txt
          python -m pip install --no-deps --no-build-isolation -e ./core-candidate -e .
          python -m pip check
      - name: Full application suite and real offline oracle cells
        env:
          ORAMA_REGISTRY_PROFILE: ${{ matrix.profile }}
        run: |
          if [ "${{ matrix.require-r3 }}" = "1" ]; then
            export ORAMA_REQUIRE_CORE_R3=1
          else
            unset ORAMA_REQUIRE_CORE_R3
          fi
          python -m pytest -q src/tests tests/oracles --junitxml=cell-results.xml
      - name: Enforce the manifest result gate
        run: python scripts/verify_cell_results.py requirements/compatibility-manifest.json cell-results.xml "${{ matrix.profile }}" "${{ matrix.python-version }}"
      - name: Retain cell receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cell-receipt-${{ matrix.profile }}-${{ matrix.python-version }}
          path: cell-results.xml
          if-no-files-found: warn
