name: POSIX test run (dispatch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to test (default: c65475e0, the PICKUP-03 base)'
        required: false
        default: 'c65475e0'

permissions:
  contents: read

jobs:
  posix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Clean production install
        run: |
          python -m pip install --no-cache-dir '.[dev]'
          python -m pip check
      - name: PICKUP-03 POSIX test files (pass/skip/fail reported separately)
        run: |
          python -m pytest -q -rs \
            tests/test_autoresearcher_backend_lock.py \
            tests/test_autoresearcher_backend_lock_review.py \
            tests/test_cline_autoresearcher.py
